name: release-core

on:
  push:
    tags:
      - "core/v*.*.*"

permissions:
  contents: write

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libpcap (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Run unit tests
        run: cd apps/core && go test ./...

  build-and-release:
    runs-on: ${{ matrix.runner }}
    needs: test-core
    strategy:
      matrix:
        include:
          # Capture-enabled (cgo + libpcap) builds must be done natively per OS/arch.
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            capture: true
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            capture: true
          - goos: darwin
            goarch: amd64
            runner: macos-13
            capture: true
          - goos: darwin
            goarch: arm64
            runner: macos-14
            capture: true

          # Windows capture build (requires Npcap installed on the target machine).
          - goos: windows
            goarch: amd64
            runner: windows-latest
            capture: true

          # Keep a windows/arm64 artifact for the install script (still nocapture).
          - goos: windows
            goarch: arm64
            runner: windows-latest
            capture: false
    steps:
      - uses: actions/checkout@v4
      - name: Install libpcap (Linux)
        if: ${{ matrix.capture && matrix.goos == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev
      - name: Install libpcap (macOS)
        if: ${{ matrix.capture && matrix.goos == 'darwin' }}
        run: |
          brew update
          brew install libpcap
      - name: Set up MSYS2 (Windows)
        if: ${{ matrix.capture && matrix.goos == 'windows' }}
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-libpcap
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build binary (unix)
        if: ${{ matrix.goos != 'windows' }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd apps/core
          EXT=""
          if [ "${GOOS}" = "windows" ]; then EXT=".exe"; fi

          TAGS=""
          CGO=0
          if [ "${{ matrix.capture }}" = "true" ]; then
            CGO=1
          else
            TAGS="-tags nocapture"
          fi

          CGO_ENABLED="${CGO}" go build -trimpath ${TAGS} -o "vvvv_${GOOS}_${GOARCH}${EXT}" ./cmd/vvvv
      - name: Build binary (windows)
        if: ${{ matrix.goos == 'windows' && matrix.capture }}
        shell: msys2 {0}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd apps/core
          TAGS=""
          CGO=0
          if [ "${{ matrix.capture }}" = "true" ]; then
            CGO=1
          else
            TAGS="-tags nocapture"
          fi

          # Build against MinGW libpcap (Npcap-compatible). Runtime requires Npcap installed.
          export CGO_ENABLED="${CGO}"
          export CC="x86_64-w64-mingw32-gcc"
          export CXX="x86_64-w64-mingw32-g++"
          go build -trimpath ${TAGS} -o "vvvv_${GOOS}_${GOARCH}.exe" ./cmd/vvvv
      - name: Build binary (windows, nocapture)
        if: ${{ matrix.goos == 'windows' && !matrix.capture }}
        shell: pwsh
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          cd apps/core
          go build -trimpath -tags nocapture -o "vvvv_${env:GOOS}_${env:GOARCH}.exe" ./cmd/vvvv
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vvvv_${{ matrix.goos }}_${{ matrix.goarch }}
          path: apps/core/vvvv_${{ matrix.goos }}_${{ matrix.goarch }}*

  publish:
    runs-on: ubuntu-latest
    needs: build-and-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Generate release notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#core/}"
          PREV_TAG="$(git tag --list 'core/v*' --sort=-version:refname | grep -vx "${TAG}" | head -n 1 || true)"
          RANGE=""
          if [ -n "${PREV_TAG}" ]; then
            RANGE="${PREV_TAG}..${TAG}"
          else
            RANGE="${TAG}"
          fi
          cat > RELEASE.md <<EOF
          <p align="center">
            <img src="https://raw.githubusercontent.com/${REPO}/main/static/images/preview.png" alt="vvvv preview" width="100%" />
          </p>
          
          ## vvvv core ${VERSION}
          
          A modern, web-based network protocol analyzer core. Captures packets with libpcap and streams decoded events to the web UI over WebSocket.

          ## Changes

          EOF
          if [ -n "${PREV_TAG}" ]; then
            echo "Compared to \`${PREV_TAG}\`:" >> RELEASE.md
            echo >> RELEASE.md
          fi
          git log --no-merges --pretty=format:'- %s (%an)' "${RANGE}" >> RELEASE.md || true
          cat >> RELEASE.md <<EOF
          
          ## Quickstart
          
          - **macOS / Linux**
          
          \`\`\`bash
          curl -fsSL https://vvvv.joachimhodana.com/install.sh | sh
          sudo vvvv
          \`\`\`
          
          - **Windows (PowerShell)**
          
          \`\`\`powershell
          irm https://vvvv.joachimhodana.com/install.ps1 | iex
          vvvv
          \`\`\`
          
          ## Notes
          
          - Packet capture typically requires **Administrator/root** privileges.
          - On Windows, packet capture requires **Npcap** installed.
          
          ## Assets
          
          Download the binary for your platform from the assets below, or use the install scripts.
          EOF
          echo >> RELEASE.md
          # List uploaded binaries (best-effort, keeps the release body tidy)
          ls -1 dist/**/vvvv_* 2>/dev/null | sed 's|^|- `|; s|$|`|' >> RELEASE.md || true
          cat >> RELEASE.md <<EOF

          ## Contributors

          EOF
          git shortlog -sne "${RANGE}" | sed 's/^/ - /' >> RELEASE.md || true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: vvvv core ${{ github.ref_name }}
          body_path: RELEASE.md
          files: |
            dist/**/vvvv_*

