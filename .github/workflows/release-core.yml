name: release-core

on:
  push:
    tags:
      - "core/v*.*.*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Run tests
        run: cd apps/core && go test ./...
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd apps/core
          go build -o vvvv-core_${{ matrix.goos }}_${{ matrix.goarch }} ./cmd/vvvv
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vvvv-core_${{ matrix.goos }}_${{ matrix.goarch }}
          path: apps/core/vvvv-core_${{ matrix.goos }}_${{ matrix.goarch }}

