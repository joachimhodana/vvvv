name: ci-core

on:
  push:
    paths:
      - "apps/core/**"
      - ".github/workflows/ci-core.yml"
  pull_request:
    paths:
      - "apps/core/**"
      - ".github/workflows/ci-core.yml"

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libpcap (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test
        run: cd apps/core && go test ./...
      - name: Build
        run: cd apps/core && go build ./cmd/vvvv

  build-matrix:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build (cross-compile)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          cd apps/core
          go build -trimpath ./cmd/vvvv

